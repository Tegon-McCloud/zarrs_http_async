[package]
name = "zarrs_http_async"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A WASM-compatible and asynchronous HTTP store for zarrs"
repository = "https://github.com/Tegon-McCloud/zarrs_http_async"
readme = "README.md"
keywords = ["zarr", "zarrs", "http", "wasm"]
categories = ["wasm"]

[dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
itertools = "0.15.0"
reqwest = "0.13.5"
thiserror = "2.0.21"
url = "2.5.8"
zarrs_storage = { version = "0.4.5", features = ["async"] }
